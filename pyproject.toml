[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "opencode-chat-export"
version = "0.1.0"
description = "Export OpenCode chat sessions to a portable, offline-readable JSON zip."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "opencode-chat-export contributors" }]
keywords = ["opencode", "chat", "export", "backup", "ephemeral"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Topic :: Utilities",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
opencode-chat-export = "opencode_chat_export.cli:main"

[project.urls]
Documentation = "https://github.com/akbargherbal/opencode-chat-export"

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
opencode_chat_export = ["schema/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["error::DeprecationWarning"]
